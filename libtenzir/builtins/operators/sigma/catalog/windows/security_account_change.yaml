id: sigma/windows/security_account_change
title: Windows Security account change
logsource:
  product: windows
  service: security
guard:
  # Provenance-scoped fields such as EventID use the Security log namespace;
  # the System log shares the source kind and is excluded by name.
  source: windows_security
  log-name: Security
  conflicting-log-names: [System]
  class-uid: 3001
  # Create, Enable, Password Change, Password Reset, Disable, Delete, Lock, and Unlock.
  activities: [1, 2, 3, 4, 5, 6, 9, 12]
fields:
  EventID:
    primitive: path
    path: metadata.event_code
    kind: source-identifier
    rule-value: stringify
    provenance-scoped: true
  SubjectUserName:
    primitive: path
    path: actor.user.name
    kind: string
  SubjectDomainName:
    primitive: path
    path: actor.user.domain
    kind: string
  SubjectUserSid:
    primitive: path
    path: actor.user.uid
    kind: string
  SubjectLogonId:
    primitive: path
    path: actor.session.uid_alt
    kind: string
  TargetUserName:
    primitive: path
    path: user.name
    kind: string
  TargetDomainName:
    primitive: path
    path: user.domain
    kind: string
  TargetSid:
    primitive: path
    path: user.uid
    kind: string
unmapped:
  - field: SamAccountName
    reason: Account attribute changes (4738) land in the OCSF user management class, which this document does not cover.
  - field: PrivilegeList
    reason: The Account Change mapping does not preserve the privilege list.
