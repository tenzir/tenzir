id: sigma/windows/security_user_management
title: Windows Security user management
logsource:
  product: windows
  service: security
guard:
  # Provenance-scoped fields such as EventID use the Security log namespace;
  # the System log shares the source kind and is excluded by name.
  source: windows_security
  log-name: Security
  conflicting-log-names: [System]
  class-uid: 3007
  # Update, Assign Privileges, and Remove Privileges.
  activities: [2, 14, 15]
fields:
  EventID:
    primitive: path
    path: metadata.event_code
    kind: source-identifier
    rule-value: stringify
    provenance-scoped: true
  SubjectUserName:
    primitive: path
    path: actor.user.name
    kind: string
  SubjectDomainName:
    primitive: path
    path: actor.user.domain
    kind: string
  SubjectUserSid:
    primitive: path
    path: actor.user.uid
    kind: string
  SubjectLogonId:
    primitive: path
    path: actor.session.uid_alt
    kind: string
  TargetUserName:
    primitive: path
    path: user.name
    kind: string
  TargetDomainName:
    primitive: path
    path: user.domain
    kind: string
  TargetSid:
    primitive: path
    path: user.uid
    kind: string
  PrivilegeList:
    primitive: path
    path: privileges
    notes: A rule value matches when any granted privilege matches.
  AccessList:
    primitive: path
    path: privileges
    notes: A rule value matches when any granted right matches.
unmapped:
  - field: SamAccountName
    reason: The User Management mapping does not preserve the SAM account name attribute.
