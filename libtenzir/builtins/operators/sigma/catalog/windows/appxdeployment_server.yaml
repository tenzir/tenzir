id: sigma/windows/appxdeployment_server
title: Windows AppX package deployments
logsource:
  product: windows
  service: appxdeployment-server
guard:
  # Provenance-scoped fields such as EventID and the free-form
  # `application.data` payload use the AppX deployment namespace.
  source: windows_appx
  class-uid: 6002
  # Install.
  activities: [1]
fields:
  EventID:
    primitive: path
    path: metadata.event_code
    kind: source-identifier
    rule-value: stringify
    provenance-scoped: true
  PackageFullName:
    primitive: path
    path: application.data.package_full_name
    kind: string
    provenance-scoped: true
  Path:
    primitive: path
    path: application.data.path
    kind: string
    provenance-scoped: true
  FilePath:
    primitive: path
    path: application.data.file_path
    kind: string
    provenance-scoped: true
  PackageSourceUri:
    primitive: path
    path: application.url.url_string
    kind: string
  ErrorCode:
    primitive: path
    path: status_code
    kind: source-identifier
    rule-value: stringify
  CallingProcess:
    primitive: fallback
    primary: actor.process.path
    fallback: actor.process.file.path
    kind: string
    notes: The process that requested the deployment.
  DeploymentOperation:
    primitive: path
    path: application.data.deployment_operation
    kind: string
    provenance-scoped: true
  HasFullTrust:
    primitive: path
    path: application.data.has_full_trust
    provenance-scoped: true
  Flags:
    primitive: path
    path: application.data.flags
    provenance-scoped: true
