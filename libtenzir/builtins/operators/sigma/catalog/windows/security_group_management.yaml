id: sigma/windows/security_group_management
title: Windows Security group management
logsource:
  product: windows
  service: security
guard:
  # Provenance-scoped fields such as EventID use the Security log namespace;
  # the System log shares the source kind and is excluded by name.
  source: windows_security
  log-name: Security
  conflicting-log-names: [System]
  class-uid: 3006
  # Add User, Remove User, Delete, Create, and Other group changes.
  activities: [3, 4, 5, 6, 9]
fields:
  EventID:
    primitive: path
    path: metadata.event_code
    kind: source-identifier
    rule-value: stringify
    provenance-scoped: true
  SubjectUserName:
    primitive: path
    path: actor.user.name
    kind: string
  SubjectDomainName:
    primitive: path
    path: actor.user.domain
    kind: string
  SubjectUserSid:
    primitive: path
    path: actor.user.uid
    kind: string
  SubjectLogonId:
    primitive: path
    path: actor.session.uid_alt
    kind: string
  TargetUserName:
    primitive: path
    path: group.name
    kind: string
    notes: Group events name the group in TargetUserName.
  TargetDomainName:
    primitive: path
    path: group.domain
    kind: string
  TargetSid:
    primitive: path
    path: group.uid
    kind: string
  MemberName:
    primitive: path
    path: user.name
    kind: string
    notes: The member's distinguished name as the source rendered it.
  MemberSid:
    primitive: path
    path: user.uid
    kind: string
unmapped:
  - field: PrivilegeList
    reason: The Group Management mapping does not preserve the privilege list.
