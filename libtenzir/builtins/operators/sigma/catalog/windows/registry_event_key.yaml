id: sigma/windows/registry_event_key
title: Windows registry key event
logsource:
  category: registry_event
  product: windows
  service: sysmon
  optional-service: true
guard:
  # Provenance-scoped fields such as EventID use the Sysmon namespace.
  source: sysmon
  class-uid: 201001
  # Create, Delete, and Rename.
  activities: [1, 4, 5]
fields:
  EventID:
    primitive: path
    path: metadata.event_code
    kind: source-identifier
    rule-value: stringify
    provenance-scoped: true
  TargetObject:
    primitive: fallback
    primary: prev_reg_key.path
    fallback: reg_key.path
    kind: string
    notes: For renames, TargetObject is the previous key path.
  NewName:
    primitive: path
    path: reg_key.path
    kind: string
    notes: Meaningful for renames, where the key path is the new name.
  EventType:
    primitive: path
    path: activity_id
    kind: integral
    rule-value:
      dictionary:
        name: registry event type
        entries:
          createkey: 1
          deletekey: 4
          renamekey: 5
    notes: Translates the Sysmon event type to the OCSF activity; a rule with another type is skipped.
  Image:
    primitive: fallback
    primary: actor.process.path
    fallback: actor.process.file.path
    kind: string
    notes: Uses the acting process.
  User:
    primitive: principal
    domain: actor.user.domain
    name: actor.user.name
    evidence: actor.user
    notes: Uses the acting user, not the affected user.
  ProcessId:
    primitive: path
    path: actor.process.pid
    kind: source-identifier
    rule-value: stringify
  ProcessGuid:
    primitive: path
    path: actor.process.uid
    kind: string
unmapped:
  - field: Details
    reason: Registry keys carry no value data.
