id: sigma/windows/security_process
title: Windows Security process creation
logsource:
  product: windows
  service: security
guard:
  # Provenance-scoped fields such as EventID use the Security log namespace;
  # the System log shares the source kind and is excluded by name.
  source: windows_security
  log-name: Security
  conflicting-log-names: [System]
  class-uid: 1007
  # Launch.
  activities: [1]
fields:
  EventID:
    primitive: path
    path: metadata.event_code
    kind: source-identifier
    rule-value: stringify
    provenance-scoped: true
  SubjectUserName:
    primitive: path
    path: actor.user.name
    kind: string
  SubjectDomainName:
    primitive: path
    path: actor.user.domain
    kind: string
  SubjectUserSid:
    primitive: path
    path: actor.user.uid
    kind: string
  SubjectLogonId:
    primitive: path
    path: actor.session.uid_alt
    kind: string
  NewProcessName:
    primitive: fallback
    primary: process.path
    fallback: process.file.path
    kind: string
  CommandLine:
    primitive: path
    path: process.cmd_line
    kind: string
  ParentProcessName:
    primitive: fallback
    primary: process.parent_process.path
    fallback: process.parent_process.file.path
    kind: string
  TargetUserName:
    primitive: path
    path: process.user.name
    kind: string
    notes: The account the new process runs as.
  TargetDomainName:
    primitive: path
    path: process.user.domain
    kind: string
  TargetUserSid:
    primitive: path
    path: process.user.uid
    kind: string
  MandatoryLabel:
    primitive: path
    path: process.integrity_id
    kind: integral
    rule-value:
      dictionary:
        name: Windows integrity level
        entries:
          s-1-16-0: 1
          s-1-16-4096: 2
          s-1-16-8192: 3
          s-1-16-12288: 4
          s-1-16-16384: 5
          s-1-16-20480: 6
    notes: Translates the mandatory-label SID to the OCSF integrity level; a rule with another label is skipped.
unmapped:
  - field: NewProcessId
    reason: The source renders process identifiers in hexadecimal; OCSF stores integers.
  - field: ProcessId
    reason: The source renders process identifiers in hexadecimal; OCSF stores integers.
  - field: TokenElevationType
    reason: The Security process mapping does not preserve the token elevation type.
