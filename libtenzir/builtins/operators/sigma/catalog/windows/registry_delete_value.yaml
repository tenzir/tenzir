id: sigma/windows/registry_delete_value
title: Windows registry value deletion
logsource:
  category: registry_delete
  product: windows
  service: sysmon
  optional-service: true
guard:
  # Provenance-scoped fields such as EventID use the Sysmon namespace.
  source: sysmon
  class-uid: 201002
  # Delete.
  activities: [4]
fields:
  EventID:
    primitive: path
    path: metadata.event_code
    kind: source-identifier
    rule-value: stringify
    provenance-scoped: true
  TargetObject:
    primitive: join
    left: reg_value.path
    right: reg_value.name
    separator: "\\"
    evidence: reg_value
  EventType:
    primitive: path
    path: activity_id
    kind: integral
    rule-value:
      dictionary:
        name: registry event type
        entries:
          deletevalue: 4
    notes: Translates the Sysmon event type to the OCSF activity; a rule with another type is skipped.
  Image:
    primitive: fallback
    primary: actor.process.path
    fallback: actor.process.file.path
    kind: string
    notes: Uses the acting process.
  User:
    primitive: principal
    domain: actor.user.domain
    name: actor.user.name
    evidence: actor.user
    notes: Uses the acting user, not the affected user.
  ProcessId:
    primitive: path
    path: actor.process.pid
    kind: source-identifier
    rule-value: stringify
  ProcessGuid:
    primitive: path
    path: actor.process.uid
    kind: string
unmapped:
  - field: Details
    reason: Deleted values carry no data.
