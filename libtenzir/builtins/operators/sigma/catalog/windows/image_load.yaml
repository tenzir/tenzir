id: sigma/windows/image_load
title: Windows image load
logsource:
  category: image_load
  product: windows
  service: sysmon
  optional-service: true
guard:
  # Provenance-scoped fields such as EventID use the Sysmon namespace.
  source: sysmon
  class-uid: 1005
  # Load.
  activities: [1]
fields:
  EventID:
    primitive: path
    path: metadata.event_code
    kind: source-identifier
    rule-value: stringify
    provenance-scoped: true
  ImageLoaded:
    primitive: path
    path: module.file.path
    kind: string
  Hashes:
    primitive: fingerprints
    path: module.file.hashes
    notes: Never pairs an algorithm with another fingerprint's value.
  SignatureStatus:
    primitive: path
    path: module.file.signature.state_id
    kind: integral
    rule-value:
      dictionary:
        name: signature status
        entries:
          valid: 1
          expired: 2
          revoked: 3
          untrusted: 6
    notes: Translates the Sysmon status to the OCSF signature state; a rule with another status is skipped.
  Signature:
    primitive: path
    path: module.file.signature.certificate.issuer
    kind: string
    notes: Uses the signer name the normalizer stored as the certificate issuer.
  OriginalFileName:
    primitive: path
    path: module.file.internal_name
    kind: string
    notes: Uses embedded executable identity and never the on-disk file name.
  Description:
    primitive: path
    path: module.file.desc
    kind: string
  Product:
    primitive: path
    path: module.file.product.name
    kind: string
  Company:
    primitive: path
    path: module.file.company_name
    kind: string
  FileVersion:
    primitive: path
    path: module.file.version
    kind: string
  Image:
    primitive: fallback
    primary: actor.process.path
    fallback: actor.process.file.path
    kind: string
    notes: Uses the acting process.
  CommandLine:
    primitive: path
    path: actor.process.cmd_line
    kind: string
    notes: Uses the acting process command line.
  User:
    primitive: principal
    domain: actor.user.domain
    name: actor.user.name
    evidence: actor.user
    notes: Uses the acting user, not the affected user.
  ProcessId:
    primitive: path
    path: actor.process.pid
    kind: source-identifier
    rule-value: stringify
  ProcessGuid:
    primitive: path
    path: actor.process.uid
    kind: string
unmapped:
  - field: Signed
    reason: OCSF encodes signing as the presence of the signature object, not as a flag.
