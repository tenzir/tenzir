id: sigma/windows/security_service
title: Windows Security service installation
logsource:
  product: windows
  service: security
guard:
  # Provenance-scoped fields such as EventID use the Security log namespace;
  # the System log shares the source kind and is excluded by name.
  source: windows_security
  log-name: Security
  conflicting-log-names: [System]
  class-uid: 201004
  # Create.
  activities: [1]
fields:
  EventID:
    primitive: path
    path: metadata.event_code
    kind: source-identifier
    rule-value: stringify
    provenance-scoped: true
  SubjectUserName:
    primitive: path
    path: actor.user.name
    kind: string
  SubjectDomainName:
    primitive: path
    path: actor.user.domain
    kind: string
  SubjectUserSid:
    primitive: path
    path: actor.user.uid
    kind: string
  SubjectLogonId:
    primitive: path
    path: actor.session.uid_alt
    kind: string
  ServiceName:
    primitive: path
    path: win_service.name
    kind: string
  ServiceFileName:
    primitive: path
    path: win_service.service_file.path
    kind: string
  ServiceAccount:
    primitive: path
    path: win_service.service_start_name
    kind: string
unmapped:
  - field: ServiceType
    reason: The Windows Service Activity mapping translates the type into enumerations, not the rendered code.
  - field: ServiceStartType
    reason: The Windows Service Activity mapping translates the start type into enumerations, not the rendered code.
