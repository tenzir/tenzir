id: sigma/windows/security_file
title: Windows Security file access
logsource:
  product: windows
  service: security
guard:
  # Provenance-scoped fields such as EventID use the Security log namespace;
  # the System log shares the source kind and is excluded by name.
  source: windows_security
  log-name: Security
  conflicting-log-names: [System]
  class-uid: 1001
  # Read, Update, and Open; the mapping reports unspecified access as Other.
  activities: [2, 3, 14]
fields:
  EventID:
    primitive: path
    path: metadata.event_code
    kind: source-identifier
    rule-value: stringify
    provenance-scoped: true
  SubjectUserName:
    primitive: path
    path: actor.user.name
    kind: string
  SubjectDomainName:
    primitive: path
    path: actor.user.domain
    kind: string
  SubjectUserSid:
    primitive: path
    path: actor.user.uid
    kind: string
  SubjectLogonId:
    primitive: path
    path: actor.session.uid_alt
    kind: string
  ObjectName:
    primitive: path
    path: file.path
    kind: string
  ObjectType:
    primitive: path
    path: class_uid
    kind: integral
    rule-value:
      dictionary:
        name: object type
        entries:
          file: 1001
    notes: Object access events (4663) route by object type into distinct classes; the type selects the class.
  ProcessName:
    primitive: fallback
    primary: actor.process.path
    fallback: actor.process.file.path
    kind: string
unmapped:
  - field: AccessMask
    reason: The source renders the access mask in hexadecimal; OCSF stores an integer.
  - field: AccessList
    reason: The object access mapping does not preserve the rendered access list.
  - field: HandleId
    reason: Handles are not part of the OCSF object access mapping.
  - field: ProcessId
    reason: The source renders process identifiers in hexadecimal; OCSF stores integers.
