id: sigma/windows/security_event_log
title: Windows Security log clearing
logsource:
  product: windows
  service: security
guard:
  # Provenance-scoped fields such as EventID use the Security log namespace;
  # the System log shares the source kind and is excluded by name.
  source: windows_security
  log-name: Security
  conflicting-log-names: [System]
  class-uid: 1008
  # Clear.
  activities: [1]
fields:
  EventID:
    primitive: path
    path: metadata.event_code
    kind: source-identifier
    rule-value: stringify
    provenance-scoped: true
  SubjectUserName:
    primitive: path
    path: actor.user.name
    kind: string
  SubjectDomainName:
    primitive: path
    path: actor.user.domain
    kind: string
  SubjectUserSid:
    primitive: path
    path: actor.user.uid
    kind: string
  SubjectLogonId:
    primitive: path
    path: actor.session.uid_alt
    kind: string
