id: sigma/windows/create_stream_hash
title: Windows alternate data stream creation
logsource:
  category: create_stream_hash
  product: windows
  service: sysmon
  optional-service: true
guard:
  # Provenance-scoped fields such as EventID use the Sysmon namespace.
  source: sysmon
  class-uid: 1001
  # Create.
  activities: [1]
fields:
  EventID:
    primitive: path
    path: metadata.event_code
    kind: source-identifier
    rule-value: stringify
    provenance-scoped: true
  TargetFilename:
    primitive: join
    left: file.path
    right: component
    separator: ":"
    evidence: file
    notes: Rebuilds the stream-qualified file name from the file path and the stream component.
  Hash:
    primitive: fingerprints
    path: file.hashes
    notes: Never pairs an algorithm with another fingerprint's value.
  Image:
    primitive: fallback
    primary: actor.process.path
    fallback: actor.process.file.path
    kind: string
    notes: Uses the acting process.
  User:
    primitive: principal
    domain: actor.user.domain
    name: actor.user.name
    evidence: actor.user
    notes: Uses the acting user, not the affected user.
  ProcessId:
    primitive: path
    path: actor.process.pid
    kind: source-identifier
    rule-value: stringify
  ProcessGuid:
    primitive: path
    path: actor.process.uid
    kind: string
unmapped:
  - field: Contents
    reason: The File System Activity mapping does not preserve stream contents.
  - field: CreationUtcTime
    reason: The File System Activity mapping stores the creation time as a timestamp, not as the Sysmon-rendered string.
