id: sigma/windows/security_entity
title: Windows Security directory and object management
logsource:
  product: windows
  service: security
guard:
  # Provenance-scoped fields such as EventID and the free-form `entity.data`
  # payload use the Security log namespace; the System log shares the source
  # kind and is excluded by name.
  source: windows_security
  log-name: Security
  conflicting-log-names: [System]
  class-uid: 3004
  # Create, Read, Update, and Delete.
  activities: [1, 2, 3, 4]
fields:
  EventID:
    primitive: path
    path: metadata.event_code
    kind: source-identifier
    rule-value: stringify
    provenance-scoped: true
  SubjectUserName:
    primitive: path
    path: actor.user.name
    kind: string
  SubjectDomainName:
    primitive: path
    path: actor.user.domain
    kind: string
  SubjectUserSid:
    primitive: path
    path: actor.user.uid
    kind: string
  SubjectLogonId:
    primitive: path
    path: actor.session.uid_alt
    kind: string
  ObjectDN:
    primitive: path
    path: entity.name
    kind: string
    notes: Directory service events name the object by distinguished name.
  ObjectName:
    primitive: path
    path: entity.name
    kind: string
  ObjectValueName:
    primitive: path
    path: entity.data.attribute
    kind: string
    provenance-scoped: true
  AttributeLDAPDisplayName:
    primitive: path
    path: entity.data.attribute
    kind: string
    provenance-scoped: true
    notes: Directory service changes name the modified attribute.
  AttributeSyntaxOID:
    primitive: path
    path: entity.data.attribute_syntax_oid
    kind: string
    provenance-scoped: true
  AttributeValue:
    primitive: path
    path: entity.data.value
    kind: string
    provenance-scoped: true
  ObjectClass:
    primitive: path
    path: entity.data.object_class
    kind: string
    provenance-scoped: true
  ObjectServer:
    primitive: path
    path: entity.data.object_server
    kind: string
    provenance-scoped: true
  ObjectType:
    primitive: fallback
    primary: entity.data.object_type
    fallback: entity.type
    kind: string
    provenance-scoped: true
    notes: Non-file, non-key object access keeps the source type as the entity type.
  OperationType:
    primitive: path
    path: entity.data.operation
    kind: string
    provenance-scoped: true
  AccessList:
    primitive: path
    path: access_list
    notes: A rule value matches when any listed access matches.
  Status:
    primitive: path
    path: status_code
    kind: string
unmapped:
  - field: Properties
    reason: The Entity Management mapping does not preserve the property GUID list.
  - field: AccessMask
    reason: The source renders the access mask in hexadecimal; OCSF stores an integer.
  - field: ObjectGUID
    reason: The Entity Management mapping stores the GUID as the entity identifier but rules compare it against distinguished names.
