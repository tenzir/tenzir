- name: Info message
  ansible.builtin.debug:
    msg: "Using static binary install"

- name: Copy the tarball to the target host
  ansible.builtin.copy:
    src: "{{ tenzir_archive }}"
    dest: /tmp/tenzir.tar.gz
    mode: '0640'
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
  register: tenzir_download

# The role runs a Tenzir node, which Tenzir packages ship only before v7.
- name: List the contents of the tarball
  # The unarchive module cannot list an archive without extracting it.
  ansible.builtin.command:  # noqa: command-instead-of-module
    cmd: tar -tzf /tmp/tenzir.tar.gz
  changed_when: false
  register: tenzir_archive_contents

- name: Fail for tarballs without a Tenzir node
  ansible.builtin.fail:
    msg: "{{ tenzir_archive }} contains no Tenzir node. This role supports only Tenzir packages before v7."
  when: >-
    tenzir_archive_contents.stdout_lines
    | select('match', '^([.]/)?opt/tenzir/bin/tenzir-node$')
    | list | length == 0

- name: Create tenzir group
  ansible.builtin.group:
    name: tenzir
    state: present

- name: Create tenzir user
  ansible.builtin.user:
    name: tenzir
    groups: tenzir
    shell: /sbin/nologin
    append: yes
    state: present
    create_home: no

- name: Copy service definition file
  ansible.builtin.copy:
    src: tenzir-node.service
    dest: /etc/systemd/system
    mode: preserve
    owner: root
    group: root

- name: Create /var/lib/tenzir
  ansible.builtin.file:
    path: "/var/lib/tenzir"
    state: directory
    mode: '0755'
    owner: tenzir
    group: tenzir

- name: Create /var/log/tenzir
  ansible.builtin.file:
    path: "/var/log/tenzir"
    state: directory
    mode: '0755'
    owner: tenzir
    group: tenzir

- name: Unarchive Tenzir release tarball
  ansible.builtin.unarchive:
    src: "/tmp/tenzir.tar.gz"
    dest: /
    remote_src: yes
