# A suite of its own, so that each test checks only its own requests.
suite: from-sentinelone-data-lake-stages
fixtures:
  - sentinelone
timeout: 180
assertions:
  fixtures:
    sentinelone:
      queries_cancelled: true
requires:
  operators:
    - from_sentinelone_data_lake
skip:
  on:
    - fixture-unavailable
    - capability-unavailable
  reason: requires the from_sentinelone_data_lake plugin
