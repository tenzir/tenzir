tenzir:
  nova: true
  pipelines:
    serve-1:
      name: serve 1
      definition: |
        from {s: "Hello World 1"},
          {s: "Hiya 1"},
          {i: 42},
          {s: "str 1", i: 0}
        serve "serve-1"
    serve_chart:
      name: serve chart
      definition: |
        from {x: 12, y: 3.5}, {x: 13, y: 4.01}
        chart_line x=x, y=y
        serve "serve_chart"
    serve_chart_renamed:
      name: serve chart renamed
      definition: |
        from {x: 12, y: 3.5}, {x: 13, y: 4.01}
        chart_line x=x, y=y
        @name = "renamed.chart"
        serve "serve_chart_renamed"
    serve_chart_multi_renamed:
      name: serve chart multi renamed
      definition: |
        from {x: 12, y: 3.5}, {x: 13, y: 4.01}
        chart_line x=x, y=y
        @name = "renamed.chart"
        serve "serve_chart_multi_renamed"
    serve_chart_options:
      name: serve chart options
      definition: |
        from {x: 1s, y: 2}, {x: 3s, y: 4}
        chart_area x=x, y=sum(y), resolution=1s, x_min=0s, x_max=4s, fill=0, y_min=0.0, y_max=100.0, x_log=true, y_log=true
        serve "serve_chart_options"
    serve_chart_grouped:
      name: serve chart grouped
      definition: |
        from {x: "a", g: "red", v: 1}, {x: "b", g: "blue", v: 2}
        chart_bar x=x, y=sum(v), group=g
        serve "serve_chart_grouped"
    serve_chart_grouped_pages:
      name: serve chart grouped pages
      definition: |
        from {x: "a", g: "red", v: 1}, {x: "b", g: "blue", v: 2}
        chart_bar x=x, y=sum(v), group=g
        serve "serve_chart_grouped_pages"
    serve_chart_multi_area:
      name: serve chart multi area
      definition: |
        from {x: 1, y: 2}, {x: 2, y: 3}
        chart_area x=x, y=sum(y), position="stacked"
        serve "serve_chart_multi_area"
    serve_chart_multi_pie:
      name: serve chart multi pie
      definition: |
        from {x: "a"}, {x: "b"}
        chart_pie x=x, y=count()
        serve "serve_chart_multi_pie"
    serve_chart_null_string:
      name: serve chart null string
      definition: |
        from {x: null, v: 1}, {x: "a", v: 2}
        chart_bar x=x, y=sum(v)
        serve "serve_chart_null_string"
    serve_chart_null_x:
      name: serve chart null x
      definition: |
        from {x: null, v: 1}, {x: 1s, v: 2}
        chart_bar x=x, y=sum(v), resolution=1s
        serve "serve_chart_null_x"
    serve_chart_pages:
      name: serve chart pages
      definition: |
        from {x: 12, y: 3.5}, {x: 13, y: 4.01}
        chart_line x=x, y=y
        serve "serve_chart_pages"
    serve_chart_field:
      name: serve chart field
      definition: |
        from {chart: "value", other: 1}
        serve "serve_chart_field"
    serve_masked:
      name: serve masked
      definition: |
        from {kind: "first"}, {discard: true}, {kind: "last"}
        where kind == "first" or kind == "last"
        serve "serve_masked"
    serve_heterogeneous:
      name: serve heterogeneous
      definition: |
        from {xs: [1, null]},
          {xs: [1, "x"]},
          {xs: [{a: 1}, {b: 2}]},
          {xs: [[1], ["x"]]},
          {xs: [1, null, {a: 2}]}
        serve "serve_heterogeneous"
    serve-2:
      name: serve 2
      definition: |
        from {s: "Hello World 2"},
          {s: "Hiya 2"},
          {i: 43},
          {s: "str 2", i: 1}
        serve "serve-2"
    serve_multi_1:
      name: serve multi 1
      definition: |
        from {s: "Hello World 1"},
          {s: "Hiya 1"},
          {i: 42},
          {s: "str 1", i: 0}
        serve "serve_multi_1"
    serve_multi_2:
      name: serve multi 2
      definition: |
        from {s: "Hello World 2"},
          {s: "Hiya 2"},
          {i: 43},
          {s: "str 2", i: 1}
        serve "serve_multi_2"
    serve_multi_partial:
      name: serve multi partial
      definition: |
        from {s: "Hello World 1"},
          {s: "Hiya 1"},
          {i: 42},
          {s: "str 1", i: 0}
        serve "serve_multi_partial"
    serve_multi_idle:
      name: serve multi idle
      definition: |
        every 1h { from {} | where false }
        serve "serve_multi_idle"
    serve_multi_schema_a:
      name: serve multi schema a
      definition: |
        from {s: "Hello World 1"},
          {s: "Hiya 1"},
          {i: 42},
          {s: "str 1", i: 0}
        serve "serve_multi_schema_a"
    serve_multi_schema_b:
      name: serve multi schema b
      definition: |
        from {s: "Hello World 2"},
          {s: "Hiya 2"},
          {i: 43},
          {s: "str 2", i: 1}
        serve "serve_multi_schema_b"
    serve_retry:
      name: serve retry
      definition: |
        from {n: 1}, {n: 2}, {n: 3}, {n: 4}
        serve "serve_retry"
    serve_multi_retry_a:
      name: serve multi retry a
      definition: |
        from {n: 1}, {n: 2}, {n: 3}, {n: 4}
        serve "serve_multi_retry_a"
    serve_multi_retry_b:
      name: serve multi retry b
      definition: |
        from {n: 5}, {n: 6}, {n: 7}, {n: 8}
        serve "serve_multi_retry_b"
    serve_first_page:
      name: serve first page
      definition: |
        from {n: 1}, {n: 2}, {n: 3}, {n: 4}
        serve "serve_first_page"
