title: Elevated Command Shell By Integrity SID
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\cmd.exe'
    IntegrityLevel:
      - 'High'
      - 'System'
      - 'S-1-16-12288' # High
      - 'S-1-16-16384' # System
  condition: selection
level: medium
