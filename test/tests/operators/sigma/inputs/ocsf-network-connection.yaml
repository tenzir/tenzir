title: Rundll32 Outbound Connection
logsource:
  category: network_connection
  product: windows
detection:
  selection:
    Image|endswith: '\rundll32.exe'
    Initiated: 'true'
    DestinationPort: 4444
    DestinationHostname|endswith: '.example.test'
    Protocol: tcp
    DestinationIp|cidr: '203.0.113.0/24'
  condition: selection
