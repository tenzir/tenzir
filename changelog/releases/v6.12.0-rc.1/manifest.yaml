created: 2026-08-17
title: Reliable Syslog ingestion over RELP
intro: >-
  Tenzir now receives Syslog reliably over RELP, including TLS and mutual TLS, with
  bounded acknowledgements and backpressure. This release also adds PCAPNG capture
  support and strengthens long-running Google SecOps and AWS pipelines.
